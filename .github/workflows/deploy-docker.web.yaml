name: Deploy - Docker (Web)

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'

# A run that has started pushing finishes, so the tags it moves stay consistent
# with what it mirrored.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GHCR_REPO: ghcr.io/${{ github.repository }}-web
  DOCKERFILE: Dockerfile.web

jobs:
  meta:
    name: Compute tags
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
      tag_prefix: ${{ steps.vars.outputs.tag_prefix }}
      additional_tags: ${{ steps.vars.outputs.additional_tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == refs/tags/v*.*.* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "tag_prefix=$VERSION" >> $GITHUB_OUTPUT
            echo "additional_tags=$VERSION latest" >> $GITHUB_OUTPUT
          else
            echo "tag_prefix=master" >> $GITHUB_OUTPUT
            echo "additional_tags=master master-latest" >> $GITHUB_OUTPUT
          fi

  build_amd64:
    name: Build amd64 image
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Without provenance the pushed digest is the amd64 image manifest
      # itself, which the manifest job merges and mirrors by digest.
      - name: Build and push amd64 docker image
        id: build
        env:
          PREFIX: ${{ needs.meta.outputs.tag_prefix }}
          SHA: ${{ needs.meta.outputs.sha_short }}
        run: |
          docker buildx build . --file "$DOCKERFILE" \
            --platform=linux/amd64 \
            --provenance=false \
            --sbom=false \
            --tag "${GHCR_REPO}:${PREFIX}-amd64" \
            --tag "${GHCR_REPO}:${PREFIX}-${SHA}-amd64" \
            --metadata-file "$RUNNER_TEMP/build.json" \
            --push
          digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/build.json")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  build_arm64:
    name: Build arm64 image
    needs: meta
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Without provenance the pushed digest is the arm64 image manifest
      # itself, which the manifest job merges and mirrors by digest.
      - name: Build and push arm64 docker image
        id: build
        env:
          PREFIX: ${{ needs.meta.outputs.tag_prefix }}
          SHA: ${{ needs.meta.outputs.sha_short }}
        run: |
          docker buildx build . --file "$DOCKERFILE" \
            --platform=linux/arm64 \
            --provenance=false \
            --sbom=false \
            --tag "${GHCR_REPO}:${PREFIX}-arm64" \
            --tag "${GHCR_REPO}:${PREFIX}-${SHA}-arm64" \
            --metadata-file "$RUNNER_TEMP/build.json" \
            --push
          digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/build.json")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  manifest:
    name: Multi-arch manifests
    needs: [meta, build_amd64, build_arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # attest, and authenticate to the image mirror
      attestations: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One index of the two per-arch digests, tagged <prefix>-<sha> and each
      # additional tag.
      - name: Create multi-arch manifests
        id: manifest
        env:
          PREFIX: ${{ needs.meta.outputs.tag_prefix }}
          SHA: ${{ needs.meta.outputs.sha_short }}
          ADDITIONAL_TAGS: ${{ needs.meta.outputs.additional_tags }}
          AMD64_DIGEST: ${{ needs.build_amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build_arm64.outputs.digest }}
        run: |
          read -ra extra <<< "$ADDITIONAL_TAGS"
          tags=("${PREFIX}-${SHA}" "${extra[@]}")
          args=()
          for tag in "${tags[@]}"; do
            args+=(-t "${GHCR_REPO}:${tag}")
          done
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/manifest.json" "${args[@]}" \
            "${GHCR_REPO}@${AMD64_DIGEST}" \
            "${GHCR_REPO}@${ARM64_DIGEST}"
          digest=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/manifest.json")
          {
            echo "tags<<EOF"
            for tag in "${tags[@]}"; do
              echo "${tag}@${digest}"
            done
            echo "${PREFIX}-amd64@${AMD64_DIGEST}"
            echo "${PREFIX}-${SHA}-amd64@${AMD64_DIGEST}"
            echo "${PREFIX}-arm64@${ARM64_DIGEST}"
            echo "${PREFIX}-${SHA}-arm64@${ARM64_DIGEST}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Both builds ran on GitHub-hosted runners in this run, so this job
      # attests the index and the per-arch images behind it. Re-running it
      # rebuilds the same index from the same per-arch digests.
      - name: Attest and mirror to Docker Hub
        uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
        with:
          image: syncoor-web
          tags: ${{ steps.manifest.outputs.tags }}
          mirror-url: ${{ secrets.IMAGE_MIRROR_URL }}
